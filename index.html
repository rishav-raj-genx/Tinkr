<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinkr - AI Voice Agent</title>
    <meta name="description" content="Tinkr voice assistant with mental state tracking and biomarker analysis">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --surface: #262626;
            --surface-elevated: #333333;
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
            --text-dim: #737373;
            --accent: #e2b714;
            --danger: #ef4444;
            --success: #10b981;
            --border: #404040;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Setup Modal ── */
        .setup-modal {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .setup-modal.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .setup-card {
            padding: 3rem;
            width: 400px;
            max-width: 90vw;
            text-align: center;
        }

        .setup-logo {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }

        .setup-logo .material-icons-round {
            font-size: 4rem;
            color: var(--text-main);
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .setup-card h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .setup-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .api-input {
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-main);
            width: 100%;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            outline: none;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .api-input:focus {
            border-color: var(--text-main);
            box-shadow: 0 0 0 1px var(--text-main);
        }

        .btn-start {
            padding: 1rem 2rem;
            border-radius: 99px;
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, opacity 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-start:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* ── Main UI Layout ── */
        .header {
            position: absolute;
            top: 2rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
        }
        
        .brand .material-icons-round {
            font-size: 1.5rem;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background: var(--surface);
        }

        /* ── Status Indicator ── */
        .status-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -180px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            z-index: 5;
            text-align: center;
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ── The Voice Orb (Centerpiece) ── */
        .main-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            position: relative;
        }

        .orb-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .call-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .call-button .material-icons-round {
            font-size: 2.5rem;
            transition: all 0.3s;
        }

        .call-button:hover {
            transform: scale(1.05);
            background: var(--surface-elevated);
        }

        .call-button.active {
            background: var(--text-main);
            color: var(--bg-color);
            transform: scale(var(--mic-scale, 1.1));
            box-shadow: 0 10px 40px rgba(255,255,255,0.2);
        }
        
        .call-button.active .material-icons-round {
            color: var(--danger);
        }

        .wave-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--text-main);
            opacity: 0;
            pointer-events: none;
            transform: scale(var(--ai-scale, 0.5));
            transition: transform 0.1s ease-out;
            z-index: 1;
            filter: blur(20px);
        }

        .speaking-mode .wave-ring {
            opacity: 0.15;
        }

        /* ── Minimal Transcript ── */
        .transcript-wrapper {
            position: absolute;
            bottom: 3rem;
            width: 100%;
            max-width: 600px;
            height: 140px;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            z-index: 5;
            mask-image: linear-gradient(to bottom, transparent, black 40%);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 40%);
        }

        .transcript-stream {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-main);
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .transcript-stream .ai-text {
            color: var(--text-main);
        }

        .transcript-stream .user-text {
            color: var(--text-muted);
            font-style: italic;
        }

        .transcript-stream .system-text {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 0.5rem;
        }

        /* ── Mental State Confirmation Modal (Clean UI) ── */
        .wellness-modal {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            width: 90%;
            max-width: 400px;
            z-index: 60;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .wellness-modal.show {
            bottom: 2rem;
        }

        .wellness-icon {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .wellness-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .wellness-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .wellness-actions {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .btn-wellness {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-wellness.confirm {
            background: var(--text-main);
            color: var(--bg-color);
        }

        .btn-wellness.confirm:hover {
            background: #fff;
        }

        .btn-wellness.reject {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-wellness.reject:hover {
            background: var(--surface-elevated);
            color: var(--text-main);
        }

        /* ── History Sidebar ── */
        .sidebar {
            position: fixed;
            right: -400px;
            top: 0;
            bottom: 0;
            width: 350px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            padding: 2rem;
            transition: right 0.3s ease;
            z-index: 50;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .sidebar-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .history-item {
            padding: 1rem;
            background: var(--surface);
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .history-state {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            text-transform: capitalize;
        }

        .history-time {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .history-details {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Animations */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <!-- ── Setup Modal ── -->
    <div id="setupModal" class="setup-modal">
        <div class="setup-card">
            <div class="setup-logo">
                <span class="material-icons-round">graphic_eq</span>
            </div>
            <h2>Tinkr</h2>
            <p>Your intelligent, empathetic voice assistant.</p>

            <input type="text" id="userId" class="api-input" placeholder="Enter your Name or ID">

            <button id="startSessionBtn" class="btn-start">Start Session</button>
        </div>
    </div>

    <!-- ── Header ── -->
    <header class="header">
        <div class="brand">
            <span class="material-icons-round">graphic_eq</span>
            Tinkr
        </div>
        <button class="icon-btn" id="historyBtn" title="Mental State History">
            <span class="material-icons-round">history</span>
        </button>
    </header>

    <!-- ── Main Stage ── -->
    <main class="main-stage">
        
        <div class="status-container">
            <span class="status-text" id="statusText">Disconnected</span>
        </div>

        <div class="orb-wrapper" id="orbContainer">
            <div class="wave-ring"></div>
            <button class="call-button" id="callBtn">
                <span class="material-icons-round">mic</span>
            </button>
        </div>

        <div class="transcript-wrapper">
            <div class="transcript-stream" id="transcriptStream">
                <!-- Text appears here naturally -->
            </div>
        </div>
    </main>

    <!-- ── Wellness Confirmation Modal ── -->
    <div class="wellness-modal" id="wellnessModal">
        <span class="material-icons-round wellness-icon" id="wellnessIcon">psychology</span>
        <div class="wellness-title" id="wellnessTitle">Stress Detected</div>
        <div class="wellness-desc" id="wellnessDesc">Voice analysis suggests you might be feeling stressed. Is this accurate?</div>
        <div class="wellness-actions">
            <button class="btn-wellness reject" onclick="confirmMentalState(false)">
                <span class="material-icons-round">close</span> Skip
            </button>
            <button class="btn-wellness confirm" onclick="confirmMentalState(true)">
                <span class="material-icons-round">check</span> Confirm
            </button>
        </div>
    </div>

    <!-- ── History Sidebar ── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><span class="material-icons-round">insights</span> Wellness Logs</h3>
            <button class="icon-btn" id="closeSidebar">
                <span class="material-icons-round">close</span>
            </button>
        </div>
        <div id="historyContent">
            <!-- Populated via JS -->
            <p style="color: var(--text-dim); text-align: center; margin-top: 2rem;">No logs available.</p>
        </div>
    </aside>

    <script>
        // ── DOM Elements ──
        const UI = {
            setupModal: document.getElementById('setupModal'),
            startBtn: document.getElementById('startSessionBtn'),
            userIdInput: document.getElementById('userId'),
            callBtn: document.getElementById('callBtn'),
            statusText: document.getElementById('statusText'),
            transcriptStream: document.getElementById('transcriptStream'),
            orbContainer: document.getElementById('orbContainer'),
            sidebar: document.getElementById('sidebar'),
            historyBtn: document.getElementById('historyBtn'),
            closeSidebar: document.getElementById('closeSidebar'),
            historyContent: document.getElementById('historyContent'),
            wellnessModal: document.getElementById('wellnessModal'),
            wellnessIcon: document.getElementById('wellnessIcon'),
            wellnessTitle: document.getElementById('wellnessTitle'),
            wellnessDesc: document.getElementById('wellnessDesc')
        };

        // ── State ──
        let isCallActive = false;
        let visualizerId = null;
        let ttsQueue = [];
        let isPlayingTts = false;
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
        }
        let audioChunks = [];
        let mediaStream = null;
        let currentUserId = '';
        let pendingBiomarkerData = null;
        let micAnalyser = null;

        // ── Navigation ──
        UI.historyBtn.addEventListener('click', () => {
            UI.sidebar.classList.add('open');
            if (currentUserId) loadHistory();
        });

        UI.closeSidebar.addEventListener('click', () => {
            UI.sidebar.classList.remove('open');
        });

        // ── Session Start ──
        UI.startBtn.addEventListener('click', async () => {
            currentUserId = UI.userIdInput.value.trim();
            if (!currentUserId) return alert("Please enter your name or ID.");

            UI.setupModal.classList.add('hidden');
            updateStatus('Ready to listen');
            setStreamText("Tap the microphone to start.", "system-text");
        });

        // ── Voice Interaction ──
        UI.callBtn.addEventListener('click', async () => {
            isCallActive = !isCallActive;

            if (isCallActive) {
                UI.callBtn.classList.add('active');
                UI.callBtn.innerHTML = '<span class="material-icons-round">stop</span>';
                updateStatus('Listening...');
                setStreamText("Listening...", "user-text");

                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    micAnalyser = audioContext.createAnalyser();
                    micAnalyser.fftSize = 256;
                    const source = audioContext.createMediaStreamSource(mediaStream);
                    source.connect(micAnalyser);
                    startVisualizer();
                    
                    if (recognition) {
                        recognition.onresult = (event) => {
                            const transcript = event.results[0][0].transcript;
                            isCallActive = false;
                            resetCallBtnUI();
                            if (mediaStream) {
                                mediaStream.getTracks().forEach(t => t.stop());
                            }
                            processText(transcript);
                        };
                        recognition.onerror = (event) => {
                            console.error("Speech Recognition Error:", event.error);
                            isCallActive = false;
                            resetCallBtnUI();
                            setStreamText("Microphone access denied or error.", "system-text");
                        };
                        recognition.onend = () => {
                            if (isCallActive) {
                                isCallActive = false;
                                resetCallBtnUI();
                                if (mediaStream) {
                                    mediaStream.getTracks().forEach(t => t.stop());
                                }
                            }
                        };
                        recognition.start();
                    } else {
                        alert("Speech recognition is not supported in this browser.");
                        isCallActive = false;
                        resetCallBtnUI();
                    }

                } catch (err) {
                    console.error("Mic Error:", err);
                    isCallActive = false;
                    resetCallBtnUI();
                    setStreamText("Microphone access denied.", "system-text");
                }
            } else {
                resetCallBtnUI();
                if (recognition) {
                    recognition.stop();
                }
                updateStatus('Processing...');
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                }
            }
        });

        function resetCallBtnUI() {
            UI.callBtn.classList.remove('active');
            UI.callBtn.innerHTML = '<span class="material-icons-round">mic</span>';
            UI.orbContainer.classList.remove('speaking-mode');
            if (visualizerId) cancelAnimationFrame(visualizerId);
            UI.callBtn.style.setProperty('--mic-scale', '1');
            UI.orbContainer.style.setProperty('--ai-scale', '0.5');
        }

        async function processText(text) {
            setStreamText(`"${text}"`, "user-text");
            setSpeakingState(true);
            updateStatus('Thinking...');
            
            try {
                const chatRes = await fetch('http://127.0.0.1:5000/api/chat_stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        user_id: currentUserId,
                        emotion_context: '' // Deprecated for ultra-low latency
                    })
                });
                
                const reader = chatRes.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let sentenceBuffer = "";
                let fullResponse = "";
                
                setStreamText("", "ai-text");
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunkStr = decoder.decode(value, {stream: true});
                    const lines = chunkStr.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            if (dataStr) {
                                try {
                                    const dataObj = JSON.parse(dataStr);
                                    if (dataObj.text) {
                                        sentenceBuffer += dataObj.text;
                                        fullResponse += dataObj.text;
                                        
                                        // Update UI incrementally
                                        setStreamText(fullResponse, "ai-text");
                                        
                                        // Check for sentence boundary for TTS chunking
                                        if (/[.!?]\\s*$/.test(sentenceBuffer)) {
                                            queueTTS(sentenceBuffer.trim());
                                            sentenceBuffer = "";
                                        }
                                    } else if (dataObj.error) {
                                        setStreamText("Error: " + dataObj.error, "system-text");
                                    }
                                } catch(e) {
                                    console.error("JSON parse error on stream:", e, line);
                                }
                            }
                        }
                    }
                }
                
                // Flush remaining buffer
                if (sentenceBuffer.trim()) {
                    queueTTS(sentenceBuffer.trim());
                }
                
                updateStatus('Ready');
                setSpeakingState(false);
                
            } catch (err) {
                console.error("Pipeline Error:", err);
                setStreamText("Network error during processing.", "system-text");
                updateStatus('Ready');
                setSpeakingState(false);
            }
        }
        
        // ── TTS Queue System ──
        function queueTTS(text) {
            ttsQueue.push(text);
            processTtsQueue();
        }
        
        function processTtsQueue() {
            if (isPlayingTts || ttsQueue.length === 0) return;
            isPlayingTts = true;
            const text = ttsQueue.shift();
            speakText(text, () => {
                isPlayingTts = false;
                processTtsQueue();
            });
        }
        
        function speakText(text, onEndCallback) {
            } catch (err) {
                console.error("Pipeline Error:", err);
                setStreamText("Network error during processing.", "system-text");
                updateStatus('Ready');
            }
        }
        
        // ── TTS (Browser Native) ──
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                const goodVoice = voices.find(v => v.name.includes("Google") || v.name.includes("Samantha") || v.name.includes("Siri"));
                if (goodVoice) utterance.voice = goodVoice;
                
                utterance.rate = 1.05; 
                
                utterance.onstart = () => {
                    UI.orbContainer.classList.add('speaking-mode');
                    startAiVisualizer();
                };
                utterance.onend = () => {
                    if (ttsQueue.length === 0) {
                        UI.orbContainer.classList.remove('speaking-mode');
                        UI.orbContainer.style.setProperty('--ai-scale', '0.5');
                        if(visualizerId) cancelAnimationFrame(visualizerId);
                    }
                    if (onEndCallback) onEndCallback();
                };
                utterance.onerror = () => {
                    if (onEndCallback) onEndCallback();
                };
                
                window.speechSynthesis.speak(utterance);
            } else {
                if (onEndCallback) onEndCallback();
            }
        }

        // ── Visualizer ──
        function startVisualizer() {
            const micData = new Uint8Array(micAnalyser.frequencyBinCount);
            function render() {
                if (!isCallActive) return;
                micAnalyser.getByteFrequencyData(micData);
                const micVol = micData.reduce((a, b) => a + b, 0) / micData.length;
                
                const micScale = 1.1 + (micVol / 255) * 0.3;
                UI.callBtn.style.setProperty('--mic-scale', micScale);
                visualizerId = requestAnimationFrame(render);
            }
            render();
        }

        function startAiVisualizer() {
            let t = 0;
            function render() {
                t += 0.1;
                const scale = 1.2 + Math.sin(t) * 0.2;
                UI.orbContainer.style.setProperty('--ai-scale', scale);
                if (UI.orbContainer.classList.contains('speaking-mode')) {
                    visualizerId = requestAnimationFrame(render);
                }
            }
            render();
        }

        // ── Wellness Modal Logic ──
        function triggerWellnessPrompt(bioData) {
            const icons = { stressed: 'warning', anxious: 'help_outline', fatigued: 'battery_alert', calm: 'self_improvement', unknown: 'question_mark' };
            UI.wellnessIcon.innerText = icons[bioData.predicted_state] || 'psychology';
            UI.wellnessTitle.innerText = `${bioData.predicted_state.charAt(0).toUpperCase() + bioData.predicted_state.slice(1)} Detected`;
            UI.wellnessDesc.innerText = `Voice analysis suggests you might be feeling ${bioData.predicted_state}. Is this accurate?`;
            UI.wellnessModal.classList.add('show');
        }

        async function confirmMentalState(confirmed) {
            UI.wellnessModal.classList.remove('show');
            if (!pendingBiomarkerData || !currentUserId) return;

            const payload = {
                user_id: currentUserId,
                predicted_state: pendingBiomarkerData.predicted_state,
                user_confirmed: confirmed,
                mean_zcr: pendingBiomarkerData.mean_zcr,
                rms_variance: pendingBiomarkerData.rms_variance,
                voice_energy_level: pendingBiomarkerData.voice_energy_level,
                suggestions: pendingBiomarkerData.suggestions || [],
            };

            try {
                await fetch('http://127.0.0.1:5000/api/save_mental_state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Save Error:", err);
            }
            pendingBiomarkerData = null;
        }
        window.confirmMentalState = confirmMentalState;

        // ── History Logic ──
        async function loadHistory() {
            UI.historyContent.innerHTML = '<p style="color: var(--text-dim); text-align: center;">Loading...</p>';
            try {
                const res = await fetch('http://127.0.0.1:5000/api/get_mental_state_history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, limit: 10 })
                });
                const data = await res.json();
                
                if (!data.success || data.history.length === 0) {
                    UI.historyContent.innerHTML = '<p style="color: var(--text-dim); text-align: center;">No logs available.</p>';
                    return;
                }

                UI.historyContent.innerHTML = data.history.map(entry => `
                    <div class="history-item">
                        <div class="history-item-header">
                            <span class="history-state">${entry.predicted_state}</span>
                            <span class="history-time">${new Date(entry.timestamp).toLocaleDateString()}</span>
                        </div>
                        <div class="history-details">
                            <div style="display:flex; align-items:center; gap:0.25rem; margin-bottom: 0.5rem;">
                                <span class="material-icons-round" style="font-size:1rem; color: ${entry.user_confirmed ? 'var(--success)' : 'var(--text-dim)'}">
                                    ${entry.user_confirmed ? 'check_circle' : 'radio_button_unchecked'}
                                </span>
                                ${entry.user_confirmed ? 'Confirmed by you' : 'Unconfirmed'}
                            </div>
                            Energy: ${entry.voice_energy_level}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                UI.historyContent.innerHTML = '<p style="color: var(--danger); text-align: center;">Error loading history.</p>';
            }
        }

        // ── Helpers ──
        function updateStatus(text) {
            UI.statusText.innerText = text;
        }

        function setSpeakingState(isSpeaking) {
            if (isSpeaking) {
                updateStatus('Tinkr is speaking...');
            } else if (!isCallActive) {
                updateStatus('Ready');
            }
        }

        function setStreamText(text, className) {
            UI.transcriptStream.innerHTML = `<div class="${className}" style="animation: fade-in 0.3s ease forwards;">${text}</div>`;
        }
    </script>
</body>
</html>
